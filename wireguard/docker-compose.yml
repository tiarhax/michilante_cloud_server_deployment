version: '3.3'
services:
  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Mexico_City
      - SERVERURL=143.198.244.111 #optional
      - SERVERPORT=51820 #optional
      - PEERS=12
      - PEERDNS=auto #optional
      - INTERNAL_SUBNET=10.13.13.0 #optional
    volumes:
      - /home/michilante/docker_configs/wireguard/peers:/config
      - /lib/modules:/lib/modules
      - /usr/src:/usr/src
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    networks:
      vpn_network:
        ipv4_address: 189.20.0.2

networks:
  vpn_network:
    name: vpn_network  # Named network for external access
    driver: bridge
    ipam:
      config:
        - subnet: 189.20.0.0/16
          gateway: 189.20.0.1
